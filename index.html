<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>Requests</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234f46e5'/%3E%3Cpath d='m12 5 7 3.5-7 3.5-7-3.5z M5 15.5l7 3.5 7-3.5 M5 12l7 3.5 7-3.5' fill='none' stroke='white' stroke-width='1.6' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <!-- Layout only: every word on this page comes from requests.json, which
       gitops/scripts/site_data.py builds from schemas/request.v1.schema.json. -->
  <header class="hero">
    <div class="hero-inner">
      <div class="brand"><span class="brand-mark" data-icon="layers"></span><span id="brand" class="brand-name"></span></div>
      <div class="hero-intro">
        <h1 id="heading"></h1>
        <p id="lead" class="lead"></p>
        <ol id="steps" class="steps"></ol>
      </div>
    </div>
  </header>

  <main>
    <nav id="actions"></nav>

    <section id="workarea" hidden>
      <button id="back" type="button" class="back"><span data-icon="back"></span><span id="back-label"></span></button>
      <form id="request" class="sheet" novalidate>
        <div class="form-head">
          <span id="form-icon" class="form-icon"></span>
          <div>
            <p id="form-kicker" class="kicker"></p>
            <h2 id="form-title"></h2>
          </div>
        </div>
        <p id="form-intro" class="intro"></p>
        <div id="fields"></div>
        <section id="review" class="review" hidden aria-live="polite">
          <h3 id="review-title"></h3>
          <ul id="outcome" class="outcome"></ul>
          <div id="notes"></div>
          <div id="approval"></div>
          <p id="tick-reminder" class="note tick" hidden></p>
          <details id="technical" hidden><summary id="json-title"></summary><pre id="request-json"></pre></details>
          <p id="access" class="note"></p>
        </section>
      </form>
    </section>
  </main>

  <div id="bar" class="bar" hidden>
    <div class="bar-inner">
      <span id="bar-status" class="bar-status" aria-live="polite"></span>
      <div class="bar-actions">
        <button id="copy-link" type="button" class="ghost" disabled><span data-icon="copy"></span></button>
        <a id="open-issue" class="cta" target="_blank" rel="noopener noreferrer" role="button">
          <span id="open-label"></span><span data-icon="external"></span>
        </a>
      </div>
    </div>
  </div>

  <footer>
    <p id="data-version"></p>
  </footer>
</body>
</html>
